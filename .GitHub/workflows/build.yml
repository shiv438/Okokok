name: Build EditPro APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android scaffold
        run: flutter create --platforms=android --org com.editpro --project-name editpro build_app

      - name: Overlay EditPro files
        run: |
          cp pubspec.yaml build_app/pubspec.yaml
          cp lib/main.dart build_app/lib/main.dart
          KT=$(find build_app/android/app/src/main/kotlin -name MainActivity.kt)
          PKG=$(grep -m1 '^package' "$KT" | awk '{print $2}')
          sed "s/^package PKG/package $PKG/" MainActivity.kt > "$KT"
          if [ -f build_app/android/app/build.gradle.kts ]; then
          cat >> build_app/android/app/build.gradle.kts <<'EOF'

          dependencies {
              implementation("androidx.media3:media3-transformer:1.5.1")
              implementation("androidx.media3:media3-effect:1.5.1")
              implementation("androidx.media3:media3-common:1.5.1")
          }
          EOF
          else
          cat >> build_app/android/app/build.gradle <<'EOF'

          dependencies {
              implementation 'androidx.media3:media3-transformer:1.5.1'
              implementation 'androidx.media3:media3-effect:1.5.1'
              implementation 'androidx.media3:media3-common:1.5.1'
          }
          EOF
          fi

      - name: Build APK
        working-directory: build_app
        run: |
          flutter pub get
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: EditPro-apk
          path: build_app/build/app/outputs/flutter-apk/app-release.apk
